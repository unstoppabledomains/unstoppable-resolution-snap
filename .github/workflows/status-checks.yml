name: Status Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test --coverage --watchAll=false

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build snap
        run: yarn build:snap

      - name: Build types
        run: yarn build:types

      - name: Build preinstalled snap
        run: yarn build-preinstalled-snap

      - name: Verify build artifacts
        run: |
          # Check that the bundle was created
          test -f dist/bundle.js
          # Check that the manifest was updated
          test -f snap.manifest.json
          # Check that the preinstalled snap was created
          test -f dist/preinstalled-snap.json
          echo "✅ All build artifacts created successfully"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run security audit
        # All dependencies in this snap project are devDependencies (bundled
        # at build time). Transitive vulnerabilities from @metamask/snaps-cli
        # and @metamask/snaps-jest cannot be resolved without upstream package
        # updates and do not affect the production snap.
        run: |
          yarn npm audit --recursive --severity critical 2>&1 | tee /tmp/audit.log || true
          # Filter out yarn's "No audit suggestions" line — it's not a vulnerability
          grep -v "No audit suggestions" /tmp/audit.log > /tmp/audit-filtered.log || true
          if [ -s /tmp/audit-filtered.log ] && ! grep -q "Via:.*@metamask" /tmp/audit-filtered.log; then
            echo "::error::Security audit found critical vulnerabilities not from @metamask transitive deps"
            exit 1
          fi
          if grep -q "Via:.*@metamask" /tmp/audit.log; then
            echo "::warning::Known @metamask transitive vulnerabilities detected — cannot fix without upstream updates"
          fi
