name: Status Checks

on: [push, pull_request]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test --coverage --watchAll=false

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build snap
        run: yarn build:snap

      - name: Build types
        run: yarn build:types

      - name: Build preinstalled snap
        run: yarn build-preinstalled-snap

      - name: Verify build artifacts
        run: |
          # Check that the bundle was created
          test -f dist/bundle.js
          # Check that the manifest was updated
          test -f snap.manifest.json
          # Check that the preinstalled snap was created
          test -f dist/preinstalled-snap.json
          echo "✅ All build artifacts created successfully"
